<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob: viewer-media:; font-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniView</title>
  <link rel="icon" type="image/svg+xml" href="/resources/app-icon.svg" />
</head>
<body>
  <div class="window-titlebar">
    <div class="window-brand"><img src="/resources/app-icon.png" alt="" /><span>OmniView</span></div>
    <nav class="window-menus" aria-label="Application menu">
      <button data-menu="File" aria-label="File menu">File</button><button data-menu="Edit" aria-label="Edit menu">Edit</button><button data-menu="View" aria-label="View menu">View</button><button data-menu="Help" aria-label="Help menu">Help</button>
    </nav>
    <span class="window-tagline">Any File. One Viewer.</span>
  </div>
  <!-- Hidden File Input -->
  <input type="file" id="file-picker-input" style="display: none;" multiple />

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="btn-primary" id="btn-open-file" title="Open file from disk (Ctrl+O)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Open</span>
      </button>

    </div>

    <!-- Multi-file Tabs -->
    <div class="tab-strip">
      <button class="btn-icon" id="tabs-left" aria-label="Scroll tabs left">‹</button>
      <div class="header-center" id="header-tabs-list"></div>
      <button class="btn-icon" id="tabs-right" aria-label="Scroll tabs right">›</button>
    </div>

    <div class="header-right">
      <select id="font-size-select" aria-label="Font size" title="Text size only">
        <option value="0.8">A 80%</option><option value="0.9">A 90%</option>
        <option value="1" selected>A 100%</option><option value="1.1">A 110%</option>
        <option value="1.25">A 125%</option><option value="1.5">A 150%</option>
      </select>
      <label class="theme-picker" title="Choose a theme">
        <span aria-hidden="true">◐</span>
        <select id="theme-select" aria-label="Theme">
          <optgroup label="Dark themes">
            <option value="dark">Slate</option>
            <option value="midnight">Midnight</option>
            <option value="graphite">Graphite</option>
            <option value="forest">Forest</option>
            <option value="violet">Violet</option>
            <option value="ember">Ember</option>
          </optgroup>
          <option value="light">Light</option>
