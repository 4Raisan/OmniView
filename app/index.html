<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob: viewer-media:; font-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniView</title>
  <link rel="icon" type="image/svg+xml" href="/resources/app-icon.svg" />
</head>
<body>
  <div class="window-titlebar">
    <div class="window-brand"><img src="/resources/app-icon.png" alt="" /><span>OmniView</span></div>
    <nav class="window-menus" aria-label="Application menu">
      <button data-menu="File" aria-label="File menu">File</button><button data-menu="Edit" aria-label="Edit menu">Edit</button><button data-menu="View" aria-label="View menu">View</button><button data-menu="Help" aria-label="Help menu">Help</button>
    </nav>
    <span class="window-tagline">Any File. One Viewer.</span>
  </div>
  <!-- Hidden File Input -->
  <input type="file" id="file-picker-input" style="display: none;" multiple />

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="btn-primary" id="btn-open-file" title="Open file from disk (Ctrl+O)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Open</span>
      </button>

    </div>

    <!-- Multi-file Tabs -->
    <div class="tab-strip">
      <button class="btn-icon" id="tabs-left" aria-label="Scroll tabs left">‹</button>
      <div class="header-center" id="header-tabs-list"></div>
      <button class="btn-icon" id="tabs-right" aria-label="Scroll tabs right">›</button>
    </div>

    <div class="header-right">
      <select id="font-size-select" aria-label="Font size" title="Text size only">
        <option value="0.8">A 80%</option><option value="0.9">A 90%</option>
        <option value="1" selected>A 100%</option><option value="1.1">A 110%</option>
        <option value="1.25">A 125%</option><option value="1.5">A 150%</option>
      </select>
      <label class="theme-picker" title="Choose a theme">
        <span aria-hidden="true">◐</span>
        <select id="theme-select" aria-label="Theme">
          <optgroup label="Dark themes">
            <option value="dark">Slate</option>
            <option value="midnight">Midnight</option>
            <option value="graphite">Graphite</option>
            <option value="forest">Forest</option>
            <option value="violet">Violet</option>
            <option value="ember">Ember</option>
          </optgroup>
          <option value="light">Light</option>
        </select>
      </label>
      <button class="btn-icon" id="btn-toggle-theme" title="Toggle light and dark"></button>
      <button class="btn-icon" id="btn-toggle-sidebar" title="Toggle Sidebar (Ctrl+B)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>
  </header>

  <!-- App Body -->
  <div id="update-notice" class="update-notice" role="status" hidden>
    <span id="update-message"></span>
    <button id="btn-view-update" class="btn-primary">View release</button>
    <button id="btn-dismiss-update" class="btn-icon" aria-label="Dismiss update notice">×</button>
  </div>
  <div class="app-body">
    <!-- Left Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-section-header">
        <span>Recent Files</span>
        <button class="btn-icon" id="btn-clear-recent" title="Clear History" style="width: 20px; height: 20px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="recent-files-list" id="recent-files-list"></div>
      <div class="sidebar-file-details" id="sidebar-file-details">
        <h4>Active File</h4>
        <div style="color: var(--text-muted); font-size: 11px;">No active document</div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="app-main">
      <div class="context-toolbar" id="context-toolbar"></div>
      <div class="viewer-canvas" id="viewer-canvas"></div>
    </main>

    <!-- Drag & Drop Overlay -->
    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-overlay-icon">📥</div>
      <h2>Drop file here to open instantly</h2>
      <p>Supports Excel, Word, PDF, Markdown, images, audio/video, code and ZIP</p>
    </div>
  </div>

  <!-- App Status Bar -->
  <footer class="app-statusbar">
    <div class="statusbar-left">
      <span class="badge-tag" id="status-type">READY</span>
      <span id="status-filename">No file open</span>
    </div>
    <div class="statusbar-right">
      <span id="status-size">0 B</span>
      <span>Shortcuts: <strong>Ctrl+O</strong> Open • <strong>Ctrl+W</strong> Close • <strong>Ctrl+B</strong> Sidebar</span>
    </div>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
