name: Build release downloads
on:
  workflow_dispatch:
# Build jobs run hundreds of npm lifecycle scripts; only publishing needs write.
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the ref and version before spending four builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo "Releases must be dispatched from main, not $GITHUB_REF."
            exit 1
          fi
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "Refusing to replace published release $tag. Bump the version first."
            exit 1
          fi
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            build: --win nsis portable --x64
            executable: release/win-unpacked/OmniView.exe
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build: --linux AppImage deb --x64
            executable: release/linux-unpacked/OmniView
          - os: macos-15
            platform: mac
            arch: arm64
            build: --mac dmg --arm64
            executable: release/mac-arm64/OmniView.app/Contents/MacOS/OmniView
          - os: macos-15-intel
            platform: mac
            arch: x64
            build: --mac dmg --x64
            executable: release/mac/OmniView.app/Contents/MacOS/OmniView
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Cache Electron binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.build }} --publish never
      # Activates only once a signing certificate is configured; unsigned builds
      # are still the documented default and must not fail here.
      - name: Verify Windows signatures
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING_THUMBPRINT != ''
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          ./tooling/scripts/verify-windows-signatures.ps1 -Files (Get-ChildItem release/*.exe).FullName -ExpectedThumbprint $env:EXPECTED_THUMBPRINT
      - name: Check packaged desktop app
        if: runner.os != 'Linux'
        run: npm test
        env:
          MULTIVIEWER_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Check packaged Linux app
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
        env:
          MULTIVIEWER_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      # The unpacked build is not what users download. Install the real NSIS setup on
      # this disposable runner, check the installed app, then verify uninstall cleanup.
      - name: Check the Windows installer artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/OmniView-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'No NSIS setup executable was produced.' }
          ./tooling/scripts/verify-windows-installer.ps1 -SetupPath $setup.FullName -InstallDir C:\omniview-ci
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces-${{ matrix.platform }}-${{ matrix.arch }}
          path: tooling/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: downloads-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error
  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: downloads-*
          path: release
          merge-multiple: true
      - name: Build the source bundle and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          git archive --format=zip --prefix="OmniView-${tag#v}-source/" --output="release/OmniView-${tag#v}-source.zip" HEAD
          unzip -t "release/OmniView-${tag#v}-source.zip"
          source_check=$(mktemp -d)
          unzip -q "release/OmniView-${tag#v}-source.zip" -d "$source_check"
          (cd "$source_check/OmniView-${tag#v}-source" && npm ci --ignore-scripts && npm run build)
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" != 'true' ]; then
              echo 'Refusing to replace a published release. Bump the version first.'
              exit 1
            fi
          else
            if [ -f "docs/releases/${tag#v}.md" ]; then
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "OmniView ${tag#v}" --notes-file "docs/releases/${tag#v}.md"
            else
              gh release create "$tag" --draft --target "$GITHUB_SHA" --title "OmniView ${tag#v}" --notes 'Verified Windows, Linux and macOS downloads, complete buildable source ZIP and SHA256SUMS.txt. Windows builds are unsigned. Mac builds use ad-hoc signing and are not notarized.'
            fi
          fi
          gh release edit "$tag" --target "$GITHUB_SHA"
          (cd release && sha256sum *.exe *.AppImage *.deb *.dmg *.zip > SHA256SUMS.txt)
      # Checksums served beside the binaries prove integrity, not origin.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
      - name: Publish the checked downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release upload "$tag" release/* --clobber